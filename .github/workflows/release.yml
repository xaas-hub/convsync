name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  checks: write
  repository-projects: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Generate a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Use a personal access token or GitHub App token with bypass permissions
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        id: semantic
        with:
          extra_plugins: |
            @semantic-release/commit-analyzer@latest
            @semantic-release/release-notes-generator@latest
            @semantic-release/changelog@latest
            @semantic-release/git@latest
            @semantic-release/github@latest
            conventional-changelog-conventionalcommits@9
        env:
          # Use the token with bypass permissions
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com

  # A tag pushed with GITHUB_TOKEN does not start a workflow run, so ci.yml
  # would never see it and the versioned tags would never reach Docker Hub.
  # Calling ci.yml directly builds them regardless of which token was used,
  # which is also why ci.yml no longer triggers on `v*`.
  build:
    name: Build Versioned Tags
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.release.outputs.new_release_version }}
      ref: v${{ needs.release.outputs.new_release_version }}
    secrets: inherit
