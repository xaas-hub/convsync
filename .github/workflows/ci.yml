name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Python dependencies are pinned and Dependabot bumps them; a monthly rebuild
  # picks up the Debian security updates of the system packages.
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to publish, without the leading v (leave empty to build latest)'
        required: false
        type: string
      ref:
        description: 'Git ref to build (leave empty for the current branch)'
        required: false
        type: string
  # Called by release.yml once semantic-release has pushed the tag: a tag
  # created with GITHUB_TOKEN does not start a workflow run of its own, hence
  # no `tags: ['v*']` trigger above.
  workflow_call:
    inputs:
      version:
        required: false
        type: string
      ref:
        required: false
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_REPOSITORY || 'frugan/convsync' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    # The release commit only touches CHANGELOG.md; skip the rebuild it would
    # otherwise trigger when semantic-release pushes with a PAT.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile

      - name: Lint the shell scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck bin/convsync src/ocr.sh tests/smoke.sh

      - name: Lint the Python code
        uses: astral-sh/ruff-action@v3
        with:
          src: src

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # The semver tags take their value from the input rather than from the
      # git ref, because this workflow is called from a run whose ref is the
      # branch, not the tag.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,enable=${{ inputs.version == '' }}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            # is_default_branch is true even in the workflow_call from
            # release.yml, whose ref is the branch and not the tag: without
            # the version guard the release run and the push run would both
            # publish latest, in parallel, and the last one would win.
            type=raw,value=latest,enable=${{ inputs.version == '' && github.ref == 'refs/heads/main' }}

      # A multi-platform build cannot be loaded into the local engine: the smoke
      # test runs on the native amd64 image, the push below adds arm64.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ci-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Generates a born digital PDF, a scan and a spreadsheet, then checks
      # extraction, OCR, incremental runs, hand-edit detection and orphan
      # removal, plus the absence of any ML runtime. See tests/smoke.sh.
      - name: Smoke test
        run: docker run --rm --network none --entrypoint /opt/convsync/tests/smoke.sh ci-test:latest

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update the Docker Hub description
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && inputs.version == ''
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          short-description: "Incremental PDF/XLSX to Markdown sync with local OCR, no AVX2 required"
          readme-filepath: ./README.md
