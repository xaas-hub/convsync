name: Auto-merge Dependabot PRs

# pull_request_target is required, not a shortcut: on a Dependabot PR the
# GITHUB_TOKEN of a plain pull_request run is read-only, so neither the
# approval nor the merge would go through. No PR code is checked out here,
# which is what makes the elevated token safe.
on:
  pull_request_target:
    types:
      - opened
      - reopened

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # --auto queues the merge behind the required checks instead of merging
      # straight away, so ci.yml still gates it. It needs "Allow auto-merge"
      # enabled in the repository settings.
      - name: Approve and enable auto-merge
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr review "${PR_URL}" --approve \
            --body "Auto-approving ${UPDATE_TYPE} dependency update"
          gh pr merge "${PR_URL}" --squash --auto
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Flag major updates for manual review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "${PR_URL}" \
            --body "🤖 Major update: review the upstream changelog and merge by hand."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on failure
        if: failure()
        run: |
          gh pr comment "${PR_URL}" \
            --body "🤖 Auto-merge failed. Check the CI status and merge manually if appropriate."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
